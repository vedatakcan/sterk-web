<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <radialGradient id="g1" cx="30%" cy="30%">
      <stop offset="0%" stop-color="#ffd9b3"/>
      <stop offset="60%" stop-color="#c68c5a"/>
      <stop offset="100%" stop-color="#4b3528"/>
    </radialGradient>
    <linearGradient id="ring" x1="0" x2="1">
      <stop offset="0%" stop-color="#eec29a" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#c07b4f" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#7a4f3a" stop-opacity="0.7"/>
    </linearGradient>
  </defs>

  <!-- soft glow -->
  <filter id="f1" x="-50%" y="-50%" width="200%" height="200%">
    <feGaussianBlur stdDeviation="18" result="b"/>
    <feBlend in="SourceGraphic" in2="b"/>
  </filter>

  <g transform="translate(300,300)">
    <ellipse rx="220" ry="60" fill="url(#ring)" transform="rotate(-18)" style="filter:url(#f1);opacity:0.9"/>
    <circle r="140" fill="url(#g1)" stroke="rgba(0,0,0,0.25)" stroke-width="6"/>
    <!-- bands -->
    <g fill="none" stroke-opacity="0.06" stroke="#000" stroke-width="18">
      <path d="M-120,-20 q60,40 240,20"/>
      <path d="M-140,10 q80,60 260,30"/>
    </g>
    <!-- rings highlight -->
    <ellipse rx="230" ry="70" fill="none" stroke="#fff" stroke-opacity="0.04" stroke-width="6" transform="rotate(-18)"/>
  </g>
</svg>