<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sterk</title>

  <!-- Global Sosyal Medya Önizleme Ayarları (Açıklamalar Kaldırıldı) -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Sterk" />
  <meta property="og:url" content="https://vedatakcan.github.io/sterk-web/invite/" />
  
  <!-- Çalışan logo.png yapısı korundu -->
  <meta property="og:image" content="https://vedatakcan.github.io/sterk-web/logo.png" />
  <meta property="og:image:type" content="image/png" />
  <meta property="og:image:width" content="300" />
  <meta property="og:image:height" content="300" />

  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="Sterk">
  <meta name="twitter:image" content="https://vedatakcan.github.io/sterk-web/logo.png">

  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      /* Sterk'in uzay temasına uygun koyu arka planı */
      background-color: #050508; 
      color: white;
    }

    /* Progress Container */
    .progress-container {
      width: 200px;
      background-color: rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      padding: 3px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.4);
    }

    /* Sterk Temasına Uygun Mor/Neon Animasyonlu Progress Bar */
    .progress-bar {
      width: 0%;
      height: 6px;
      background: linear-gradient(90deg, #9c27b0, #e040fb); 
      border-radius: 10px;
      animation: loadBar 1.2s cubic-bezier(0.4, 0, 0.2, 1) forwards;
    }

    @keyframes loadBar {
      0% { width: 0%; }
      50% { width: 70%; }
      100% { width: 100%; }
    }
  </style>
</head>
<body>

<!-- Ekranda sadece Sterk renklerinde bu progress bar görünecek, sıfır yazı! -->
<div class="progress-container">
  <div class="progress-bar"></div>
</div>

<script>
  const ua = navigator.userAgent || navigator.vendor || window.opera;
  const isAndroid = /Android/i.test(ua);
  const isIOS = /iPhone|iPad|iPod/i.test(ua);

  // Sterk uygulamasının güncel mağaza linkleri
  const iosStore = "https://apps.apple.com/app/id6763731084";
  const androidStore = "https://play.google.com/store/apps/details?id=com.vedatakcan.sterk";
  const fallbackUrl = "https://vedatakcan.github.io/sterk-web/";

  let targetUrl = fallbackUrl;

  if (isIOS) {
    targetUrl = iosStore;
  } else if (isAndroid) {
    targetUrl = androidStore;
  }

  // Kullanıcının şık bar animasyonunu anlık görebilmesi için kısa bir gecikmeyle yönlendiriyoruz
  setTimeout(function() {
    window.location.replace(targetUrl);
  }, 100); 
</script>

</body>
</html>
